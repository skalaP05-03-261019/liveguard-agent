global
    maxconn 128

defaults
    mode http
    timeout connect 3s
    timeout client 15s
    timeout server 15s
    timeout queue 1s
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend business_mcp
    bind :8002
    default_backend mcp_instances

backend mcp_instances
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server mcp1 mcp-1:8002 check maxconn 16
    server mcp2 mcp-2:8002 check maxconn 16
